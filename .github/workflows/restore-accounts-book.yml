name: Restore Accounts Book
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sidebar-drag.patch"
      - "scripts/sidebar-drag-b.patch"
      - ".github/workflows/restore-accounts-book.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Accounts Book from last good commit + sidebar drag patches
        run: |
          set -euo pipefail
          GOOD_SHA="88ce9653e891148b326def3df2a0e87ebdfdfbd1"
          git show "${GOOD_SHA}:src/routes/admin.accounts-book.tsx" > src/routes/admin.accounts-book.tsx
          echo "Restored base from ${GOOD_SHA} ($(wc -c < src/routes/admin.accounts-book.tsx) bytes)"
          if [ -f scripts/sidebar-drag.patch ]; then
            patch -p1 < scripts/sidebar-drag.patch
            echo "Applied sidebar-drag.patch"
          fi
          if [ -f scripts/sidebar-drag-b.patch ]; then
            patch -p1 < scripts/sidebar-drag-b.patch
            echo "Applied sidebar-drag-b.patch"
          fi
          grep -q SIDEBAR_ORDER_KEY src/routes/admin.accounts-book.tsx
          grep -q orderedTabGroups src/routes/admin.accounts-book.tsx
          grep -q applySidebarReorder src/routes/admin.accounts-book.tsx
          grep -q drag-handle src/routes/admin.accounts-book.tsx
          echo "Sidebar drag markers present"
      - name: Commit restored page
        run: |
          git config user.name "rohitravelsryk-git"
          git config user.email "rohitravelsryk@gmail.com"
          git add src/routes/admin.accounts-book.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Restore Accounts Book page with draggable sidebar reorder"
          git push
