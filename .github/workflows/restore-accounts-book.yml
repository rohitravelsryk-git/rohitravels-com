name: Restore Accounts Book
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/admin.accounts-book.tsx.zlib.b64.part*"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore admin.accounts-book.tsx from compressed parts
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib, glob
          parts = sorted(glob.glob("scripts/admin.accounts-book.tsx.zlib.b64.part*"))
          b64 = "".join(pathlib.Path(p).read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path("src/routes/admin.accounts-book.tsx").write_bytes(data)
          print("restored", len(data), "bytes from", len(parts), "parts")
          PY
      - name: Commit restored page
        run: |
          git config user.name "rohitravelsryk-git"
          git config user.email "rohitravelsryk@gmail.com"
          git add src/routes/admin.accounts-book.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Restore Accounts Book page with draggable sidebar"
          git push
