name: Restore Accounts Book
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/admin.accounts-book.tsx.zlib.b64"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore admin.accounts-book.tsx from compressed artifact
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path("scripts/admin.accounts-book.tsx.zlib.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path("src/routes/admin.accounts-book.tsx").write_bytes(data)
          print("restored", len(data), "bytes")
          PY
      - name: Commit restored page
        run: |
          git config user.name "rohitravelsryk-git"
          git config user.email "rohitravelsryk@gmail.com"
          git add src/routes/admin.accounts-book.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Restore Accounts Book page with draggable sidebar"
          git push
