name: Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations to the production Supabase project"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    name: Preview or apply production migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Read production project ref
        shell: bash
        run: |
          set -euo pipefail
          project_ref="$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml | head -n 1)"
          test -n "$project_ref" || { echo "::error::No project_id found in supabase/config.toml"; exit 1; }
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
          echo "Production project ref loaded from supabase/config.toml."

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase migration list

      - name: Preview pending migrations
        if: ${{ !inputs.apply }}
        run: supabase db push --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.apply }}
        run: supabase db push
