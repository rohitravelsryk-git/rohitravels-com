name: Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the production airline-ledger repair only (safe for current schema drift)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    name: Preview or apply production migrations
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate production database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "::error::Missing SUPABASE_DB_URL GitHub Actions secret."
            echo "::error::Add the production Session Pooler connection string from Supabase Dashboard → Connect."
            exit 1
          }
          SUPABASE_DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          export SUPABASE_DB_URL
          if [[ ! "$SUPABASE_DB_URL" =~ ^[Pp][Oo][Ss][Tt][Gg][Rr][Ee][Ss]([Qq][Ll])?:// ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string beginning with postgres:// or postgresql://."
            exit 1
          fi
          echo "Production database connection secret is configured."

      - name: Show migration history and drift
        run: |
          set -euo pipefail
          echo "Current production migration history:"
          supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview repair SQL
        if: ${{ !inputs.apply }}
        run: |
          echo "No database changes were made."
          echo "The production database has migration-history drift, so a normal 'supabase db push' is intentionally not used here."
          echo "The safe repair file is: supabase/migrations/20260930110000_ensure_airline_ledger_revision_rpc.sql"

      - name: Apply airline ledger RPC repair
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Applying only the idempotent airline-ledger RPC repair."
          echo "This deliberately does NOT replay the older pending migrations because production already contains objects such as public.fares."
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260930110000_ensure_airline_ledger_revision_rpc.sql
          echo "Airline ledger revision RPC repair applied successfully."

      - name: Verify airline ledger revision RPC
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='select public.get_airline_ledger_revision();')"
          test -n "$result" || {
            echo "::error::The airline ledger revision RPC did not return a revision after repair."
            exit 1
          }
          echo "Verified public.get_airline_ledger_revision(): $result"
