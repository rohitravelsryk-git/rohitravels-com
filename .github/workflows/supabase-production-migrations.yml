name: Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations to the production Supabase project"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    name: Preview or apply production migrations
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate production database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "::error::Missing SUPABASE_DB_URL GitHub Actions secret."
            echo "::error::Add the production Session Pooler connection string from Supabase Dashboard → Connect."
            exit 1
          }
          SUPABASE_DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          export SUPABASE_DB_URL
          if [[ ! "$SUPABASE_DB_URL" =~ ^[Pp][Oo][Ss][Tt][Gg][Rr][Ee][Ss]([Qq][Ll])?:// ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string beginning with postgres:// or postgresql://."
            exit 1
          fi
          echo "Production database connection secret is configured."

      - name: Show pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations
        if: ${{ !inputs.apply }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.apply }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
