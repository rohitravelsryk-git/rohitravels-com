name: ROHI Security Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security detector
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit

      - name: Dependency vulnerability audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check for accidental environment files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' \) -not -path './node_modules/*' | grep -q .; then
            echo '::error::Environment files must never be committed.'
            find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' \) -not -path './node_modules/*'
            exit 1
          fi

      - name: Scan repository for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^[:space:]]+|GOOGLE_SERVICE_ACCOUNT_JSON[[:space:]]*=' -- ':!package-lock.json'; then
            echo '::error::Potential credential material found in tracked source.'
            exit 1
          fi

      - name: Build verification
        run: npm run build

      - name: Security summary
        run: |
          echo 'ROHI security guard passed.'
          echo 'Database authority: Supabase'
          echo 'Emergency financial view: Google Sheets'
          echo 'No Google sheet is treated as a second source of truth.'
