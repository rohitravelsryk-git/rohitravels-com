name: Rohi Lockfile Repair

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/rohi-lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Commit lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Regenerate Bun lockfile after dependency cleanup"
          git push
